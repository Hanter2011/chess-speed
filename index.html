<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UltraSpeed Chess</title>
<style>
:root{--bg:#161512;--sf:#262421;--el:#302e2c;--elh:#3d3a37;--bd:#363431;--tx:#bababa;--txh:#ffffff;--ac:#3692e7;--gr:#629924;--l:#f0d9b5;--d:#b58863}
.light-ui{--bg:#edebe9;--sf:#ffffff;--el:#f4f3f1;--elh:#e6e4e1;--bd:#dcdad7;--tx:#5e5c59;--txh:#1a1917}
.b1{--l:#eeeed2;--d:#769656}.b2{--l:#dee3e6;--d:#8ca2ad}.b3{--l:#d9d9d9;--d:#888}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;width:100%}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;color:var(--txh)}.brand span{color:var(--tx);font-weight:400;opacity:.75}
.hdr-r{display:flex;align-items:center;gap:8px}
.acc-pill{background:var(--el);color:var(--txh);padding:6px 10px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.acc-pill i{font-style:normal;color:var(--gr);font-size:9px}
.menu-btn{background:var(--el);color:var(--txh);border:0;padding:6px 12px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 0 20px;gap:10px;width:100%}
@media(min-width:860px){.main{flex-direction:row;align-items:flex-start;justify-content:center;gap:28px;padding-top:26px}.menu-btn{display:none}}
.center-col{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:480px}
.mode-tabs{display:flex;width:calc(100% - 16px);background:var(--sf);border-radius:4px;overflow:hidden;border:1px solid var(--bd)}
.mode-tabs button{flex:1;padding:9px;border-radius:0;font-size:13px;background:transparent;border:0;color:var(--tx)}
.mode-tabs button.on{background:var(--el);color:var(--txh);border-bottom:2px solid var(--gr)}
.hud{display:flex;width:calc(100% - 16px);background:var(--sf);border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.hud-item{flex:1;text-align:center;padding:7px 4px;border-right:1px solid var(--bd);opacity:.65;transition:opacity .1s,background .1s}
.hud-item:last-child{border-right:0}
.hud-item.act{opacity:1;background:var(--el)}
.hud-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.hud-val{font-size:21px;font-weight:700;color:var(--txh);font-variant-numeric:tabular-nums;margin-top:2px}
.danger{background:rgba(180,40,40,.25)!important;opacity:1!important}.danger .hud-val{color:#e5534b!important}
.res-bar{display:none;width:calc(100% - 16px);padding:8px 12px;border-radius:4px;text-align:center;font-weight:700;font-size:13px;color:#fff;background:var(--gr)}
.res-bar.lose{background:#b53838}
.board-wrap{position:relative;width:100vw;height:100vw;max-width:480px;max-height:480px}
#b{position:relative;display:grid;grid-template-columns:repeat(8,12.5%);grid-template-rows:repeat(8,12.5%);width:100%;height:100%;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.35);touch-action:none}
@media(min-width:481px){#b{border-radius:4px}}
.sq{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.l{background:var(--l);color:var(--d)}.d{background:var(--d);color:var(--l)}
.coord-r{position:absolute;top:2px;left:3px;font-size:10px;font-weight:700;line-height:1;pointer-events:none;opacity:.85}
.coord-f{position:absolute;bottom:2px;right:3px;font-size:10px;font-weight:700;line-height:1;pointer-events:none;opacity:.85}
.sel::before,.lst::before,.pm::before{content:"";position:absolute;inset:0;pointer-events:none}
.sel::before{background:rgba(20,85,30,.5)}.lst::before{background:rgba(155,199,0,.4)}.pm::before{background:rgba(20,30,100,.35)}
.dot::after{content:"";width:24%;height:24%;background:rgba(20,85,30,.45);border-radius:50%;z-index:2;pointer-events:none}
.cap::after{content:"";position:absolute;inset:0;border:4px solid rgba(20,85,30,.45);border-radius:50%;z-index:2;pointer-events:none}
.pc{width:96%;height:96%;pointer-events:none;z-index:3;display:flex;align-items:center;justify-content:center}
.pc svg{width:100%;height:100%;display:block}
#gh{position:fixed;top:0;left:0;width:64px;height:64px;pointer-events:none;z-index:99;display:none;align-items:center;justify-content:center}
#gh svg{width:100%;height:100%}
.quick-bar{display:flex;gap:8px;width:calc(100% - 16px)}
.quick-bar button{flex:1;padding:10px;border-radius:4px;font-size:13px}
.sidebar{position:fixed;top:0;right:-320px;width:300px;height:100vh;background:var(--sf);border-left:1px solid var(--bd);z-index:50;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;transition:right .2s ease;box-shadow:-8px 0 24px rgba(0,0,0,.4)}
.sidebar.open{right:0}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}.backdrop.open{display:block}
@media(min-width:860px){.sidebar{position:static;width:315px;height:auto;border-radius:4px;border:1px solid var(--bd)}.backdrop,.close-sb{display:none!important}}
.sb-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--txh);font-size:14px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.sb-group{display:flex;flex-direction:column;gap:6px}
.sb-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.6;font-weight:700;margin-top:4px}
.sb-row{display:flex;align-items:center;justify-content:space-between;background:var(--el);padding:6px 10px;border-radius:4px;gap:8px}
.sb-row span{font-size:12px;font-weight:500;color:var(--txh)}
.seg{display:flex;gap:3px}
button{background:var(--el);color:var(--txh);border:0;padding:6px 9px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer}
button:hover{background:var(--elh)}button:active{opacity:.85}
button.on{background:var(--ac);color:#fff}button.gr{background:var(--gr);color:#fff}
.pg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pcell{aspect-ratio:1/1;background:var(--el);border-radius:4px;display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer}
.pcell.on{background:var(--ac);color:#fff}
.lb-list{display:flex;flex-direction:column;gap:4px;font-size:12px}
.lb-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--el);border-radius:4px;color:var(--txh)}
.lb-item b{font-weight:700}
</style>
</head>
<body>
<header>
  <div class="brand">LICHESS <span>SPEED TRAINER</span></div>
  <div class="hdr-r">
    <div class="acc-pill" onclick="editNick()"><i>●</i><span id="nickTop">Player</span></div>
    <button class="menu-btn" data-i="params" onclick="toggleSB(1)">Settings</button>
  </div>
</header>
<div class="backdrop" id="bd" onclick="toggleSB(0)"></div>
<div class="main">
  <div class="center-col">
    <div class="mode-tabs">
      <button id="mSolo" class="on" data-i="solo" onclick="setGameMode(0)">Solo</button>
      <button id="mSpeed" data-i="speedtest" onclick="setGameMode(1)">Speedtest</button>
    </div>
    <div class="hud">
      <div class="hud-item act" id="tBox"><div class="hud-lbl" id="tLbl" data-i="time">Time</div><div class="hud-val" id="t">15.0</div></div>
      <div class="hud-item" id="btBox" style="display:none"><div class="hud-lbl" data-i="bot">Bot</div><div class="hud-val" id="bt">15.0</div></div>
      <div class="hud-item" style="opacity:1"><div class="hud-lbl" data-i="moves">Moves</div><div class="hud-val" id="m">0</div></div>
      <div class="hud-item" style="opacity:1"><div class="hud-lbl" data-i="mps">Moves / s</div><div class="hud-val" id="s">0.00</div></div>
    </div>
    <div class="res-bar" id="resBar"></div>
    <div class="board-wrap"><div id="b"></div></div>
    <div class="quick-bar">
      <button class="gr" data-i="reset" onclick="rst()">Reset</button>
      <button id="edBtn" data-i="editor" onclick="toggleEd(1);toggleSB(1)">Board Editor</button>
    </div>
  </div>
  <div id="gh"></div>
  <aside class="sidebar" id="sb">
    <div class="sb-head"><span data-i="settings">Settings</span><button class="close-sb" data-i="close" onclick="toggleSB(0)">Close</button></div>
    <div id="ui" class="sb-group">
      <div class="sb-title" data-i="account">Account</div>
      <div class="sb-row"><span id="accStats">Player • 0W</span><button data-i="nickBtn" onclick="editNick()">Nickname</button></div>
      <div class="sb-row"><span data-i="lang">Language</span><div class="seg"><button id="len" onclick="setLang('en')">EN</button><button id="lru" onclick="setLang('ru')">RU</button><button id="ltr" onclick="setLang('tr')">TR</button></div></div>
      <div class="sb-title" data-i="mode">Game Mode</div>
      <div class="sb-row"><span data-i="color">Pieces</span><div class="seg"><button id="cw" onclick="setSide('w')">White</button><button id="cb" onclick="setSide('b')">Black</button></div></div>
      <div class="sb-row"><span data-i="timer">Timer</span><div class="seg"><button id="t15" onclick="setDur(15)">15s</button><button id="t0" data-i="inf" onclick="setDur(0)">None</button><button id="tc" data-i="custom" onclick="askDur()">Custom</button></div></div>
      <div class="sb-row"><span data-i="botSpd">Bot Speed</span><div class="seg"><button id="bs5" onclick="setBotSpd(5)">5</button><button id="bs8" onclick="setBotSpd(8)">8</button><button id="bs0" data-i="instant" onclick="setBotSpd(0)">Max</button></div></div>
      <div class="sb-title" data-i="design">Appearance</div>
      <div class="sb-row"><span data-i="pstyle">Piece Set</span><button id="pcBtn" onclick="nextPieceStyle()">Classic (1/5)</button></div>
      <div class="sb-row"><span data-i="bcolor">Board Theme</span><button data-i="change" onclick="nextBoard()">Switch</button></div>
      <div class="sb-row"><span data-i="theme">UI Theme</span><button id="thBtn" onclick="toggleTheme()">Dark</button></div>
      <div class="sb-row"><span data-i="sound">Move Sound</span><button id="sndBtn" onclick="toggleSnd()">On</button></div>
      <div class="sb-title" data-i="fen">Position FEN</div>
      <div class="sb-row"><span data-i="clip">Clipboard</span><div class="seg"><button data-i="copy" onclick="copyFen()">Copy</button><button data-i="paste" onclick="loadFen()">Paste</button></div></div>
    </div>
    <div id="pal" class="sb-group" style="display:none">
      <div class="sb-title" data-i="setup">Piece Setup</div>
      <div class="pg" id="pg"></div>
      <div class="sb-row"><span data-i="side">Side</span><button id="ec" class="on" onclick="edWho=edWho=='u'?'o':'u';updEdWho();buildPal()">My Pieces</button></div>
      <div class="seg" style="margin-top:4px"><button data-i="clear" onclick="P=Array(64).fill('');SV=P.slice();render()">Clear</button><button data-i="start" onclick="P=makeStart(side);SV=P.slice();render()">Starting</button></div>
      <button class="gr" style="margin-top:4px;padding:10px" data-i="done" onclick="toggleEd(0)">Done</button>
    </div>
    <div class="sb-group">
      <div class="sb-title" id="lbTitle">Leaderboard</div>
      <div class="lb-list" id="lb"></div>
    </div>
  </aside>
</div>

};
const BTH=['','b1','b2','b3'];
const B=document.getElementById('b'),G=document.getElementById('gh');
let cfg=Object.assign({uid:'u_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36),lang:'en',bth:0,pSt:0,lightUI:0,side:'w',dur:15,snd:1,botSpd:0,nick:'Player_'+Math.floor(100+Math.random()*900),wins:0},JSON.parse(localStorage.getItem('chess_cfg')||'{}'));

function t(k){return LANGS[lang][k]||LANGS.en[k];}
async function editNick(){
  let v=prompt(t('askNick'),nick);if(!v)return;
